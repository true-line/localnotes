# Lifecycle-aware validation inherited from playbook-engineering ENG-0004.
# Repository Actions Policy is the primary actor/fork boundary; the immutable
# policy action below is a second, fail-closed check before repository code runs.
name: CI
run-name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      purpose:
        description: Why the complete suite is being run manually
        required: true
        type: choice
        options:
          - exact-sha-preflight
          - diagnostics
          - release-recovery
          - workflow-testing
          - explicit-rerun

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# Jobs run on the organisation's own runners: the Linux runner group holds one
# x86-64 runner, the MacOS group one arm64 runner. A fork's pull request and a
# merge-queue run keep a hosted runner, because a pull request controls the
# workflow file it runs and would otherwise execute its own code on the
# organisation's hardware. When the self-hosted queue has stalled longer than
# CI_RUNNER_FALLBACK_MINUTES (default 10), the route job moves the whole run
# onto hosted runners instead: a dead fleet must not stop the reviewed
# lifecycle. The route job itself always runs hosted, because it must run
# precisely when the organisation's runners cannot take work.
jobs:
  route:
    name: Route onto a live runner pool
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/runner-route.yml
    secrets:
      chores_client_id: ${{ secrets.CHORES_DUMB_CLIENT_ID }}
      chores_private_key: ${{ secrets.CHORES_DUMB_PRIVATE_KEY }}
  policy:
    name: Action Policy
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
      run_full: ${{ steps.policy.outputs.run_full }}
      run_post_merge: ${{ steps.policy.outputs.run_post_merge }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - id: policy
        uses: true-line/trueline-agent-ci/.github/actions/ci-policy@b1c6bf80380f35e83168bcbef5b86d89b0d652e3

  merge-evidence:
    name: Verify merged commit evidence
    needs: [route, policy]
    if: needs.policy.outputs.run_post_merge == 'true'
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 10
    outputs:
      validated: ${{ steps.evidence.outputs.validated }}
    steps:
      - id: evidence
        name: Find a successful ready-PR gate for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq 'first(.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .event == "pull_request" and .conclusion == "success") | .id) // empty')
          validated=false
          if [ -n "$run_id" ]; then
            validated=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
              --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')
          fi
          echo "validated=$validated" >> "$GITHUB_OUTPUT"

  preflight-evidence:
    name: Verify preflight evidence
    needs: [route, policy]
    if: github.event_name == 'pull_request' && needs.policy.outputs.run_full == 'true'
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 10
    outputs:
      validated: ${{ steps.evidence.outputs.validated }}
    steps:
      - id: evidence
        name: Find a successful manual complete suite for the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&head_sha=$TARGET_SHA&per_page=100" \
            --jq 'first(.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .conclusion == "success") | .id) // empty')
          validated=false
          if [ -n "$run_id" ]; then
            validated=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
              --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')
          fi
          echo "validated=$validated" >> "$GITHUB_OUTPUT"

  test:
    needs: [route, policy, merge-evidence, preflight-evidence]
    if: >-
      always() && needs.route.result == 'success' &&
      needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        uses: true-line/trueline-agent-ci/.github/actions/bounded-command@b1c6bf80380f35e83168bcbef5b86d89b0d652e3
        with:
          task: Install locked dependencies
          executable: npm
          arguments-json: '["ci"]'
          timeout-seconds: '600'
          attempts: '2'
          retry-delay-seconds: '5'
      - run: npm run lint
      - run: npm test
      - run: npm run build

  post-merge:
    name: Post-merge smoke
    needs: [route, policy, merge-evidence]
    if: needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated == 'true'
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked smoke dependencies
        uses: true-line/trueline-agent-ci/.github/actions/bounded-command@b1c6bf80380f35e83168bcbef5b86d89b0d652e3
        with:
          task: Install locked smoke dependencies
          executable: npm
          arguments-json: '["ci"]'
          timeout-seconds: '600'
          attempts: '2'
          retry-delay-seconds: '5'
      - run: npm run lint
      - run: npm test
      - run: npm run build

  codeql:
    needs: [route, policy, merge-evidence, preflight-evidence]
    if: >-
      always() && needs.route.result == 'success' &&
      needs.policy.result == 'success' &&
      (needs.policy.outputs.run_post_merge == 'true' ||
      (needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true'))
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    with:
      runner: ${{ needs.route.outputs.runner }}

  workflow-runtime:
    name: Workflow runtime policy
    needs: [route, policy]
    if: needs.policy.result == 'success'
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 10
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout pinned runtime checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: true-line/trueline-agent-ci
          ref: b1c6bf80380f35e83168bcbef5b86d89b0d652e3
          path: .ci-runtime-policy
          sparse-checkout: tools/ci-runtime
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enforce bounded workflow runtime
        run: node .ci-runtime-policy/tools/ci-runtime/runtime-policy.mjs --root "$GITHUB_WORKSPACE"

      - name: Lint workflow files
        env:
          ACTIONLINT_VERSION: '1.7.12'
          # actionlint_1.7.12_linux_amd64.tar.gz, from the release checksums.
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          # A pinned release verified against a pinned checksum: the
          # validation lane takes no floating dependency, and workflow
          # expression mistakes fail the gate before merge rather than at
          # dispatch. shellcheck integration stays optional: hosted runners
          # carry it, the organisation fleet does not.
          curl -fsSL --retry 2 -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tgz" | shasum -a 256 --check -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/actionlint"

  gate:
    name: CI
    needs: [route, policy, merge-evidence, preflight-evidence, test, codeql, post-merge, workflow-runtime]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 5
    steps:
      - name: Enforce the selected lifecycle lane
        env:
          ROUTE: ${{ needs.route.result }}
          MODE: ${{ needs.policy.outputs.mode }}
          POLICY: ${{ needs.policy.result }}
          WORKFLOW_RUNTIME: ${{ needs.workflow-runtime.result }}
          TEST: ${{ needs.test.result }}
          CODEQL: ${{ needs.codeql.result }}
          PREFLIGHT: ${{ needs.preflight-evidence.result }}
          PREFLIGHT_VALIDATED: ${{ needs.preflight-evidence.outputs.validated }}
          MERGE_VALIDATED: ${{ needs.merge-evidence.outputs.validated }}
          POST_MERGE: ${{ needs.post-merge.result }}
        run: |
          test "$ROUTE" = success
          test "$POLICY" = success
          test "$WORKFLOW_RUNTIME" = success
          case "$MODE" in
            full)
              if [ "$PREFLIGHT_VALIDATED" = true ]; then
                test "$PREFLIGHT" = success
              else
                test "$TEST" = success
                test "$CODEQL" = success
              fi
              ;;
            manual)
              test "$TEST" = success
              test "$CODEQL" = success
              ;;
            post-merge)
              test "$CODEQL" = success
              if [ "$MERGE_VALIDATED" = true ]; then
                test "$POST_MERGE" = success
              else
                test "$TEST" = success
              fi
              ;;
            *) exit 1 ;;
          esac
