# Fleet-health probe shared by CI and Release. It answers one question before
# any job lands on the organisation's hardware: are the self-hosted runners
# taking work right now? Two independent signals feed the decision:
#
#   1. Fleet census. With the chores-dumb credentials passed by the caller,
#      the probe counts online runners carrying the fleet's labels through
#      the org runner API. Zero online fleet runners routes hosted, which
#      covers a dead fleet at dispatch even when the queue is empty — the
#      probe cannot see this run's own jobs, which have not queued yet. If
#      the census itself fails, the queue signal below still stands: a
#      census failure only removes the extra check, it does not poison the
#      queue evidence.
#   2. Queue age. A healthy fleet drains the shared queue in seconds to a
#      few minutes, so the oldest still-queued workflow run is the cheapest
#      observable for a wedged-but-online fleet, which the census cannot
#      see. When that run has waited longer than CI_RUNNER_FALLBACK_MINUTES
#      (repository variable, default 10), the run routes hosted.
#
# An unreadable queue also routes hosted: unknown fleet health must not
# hang the run. The probe itself always runs hosted, and only reads the
# Actions API; its decision logic lives in scripts/runner-route.ts (unit-
# tested in src/__tests__/runner-route.test.ts), which is why the probe
# checks out the repository with a shallow, credential-free clone.
name: Runner route

on:
  workflow_call:
    outputs:
      runner:
        description: JSON array of runs-on labels for the calling run's jobs
        value: ${{ jobs.probe.outputs.runner }}
    secrets:
      chores_client_id:
        description: Chores-dumb App client id, for the fleet runner census
        required: false
      chores_private_key:
        description: Chores-dumb App private key, for the fleet runner census
        required: false

permissions:
  actions: read

jobs:
  probe:
    name: Probe runner fleet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The secrets context is unavailable in step-level if expressions; the
    # presence check renders into job env instead, the same pattern the
    # Version cut and Release workflows use for their chores-dumb steps.
    env:
      HAS_CHORES: ${{ secrets.chores_client_id != '' && secrets.chores_private_key != '' }}
    outputs:
      runner: ${{ steps.route.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Mint the chores-dumb census token
        id: chores
        if: env.HAS_CHORES == 'true'
        # The census is optional: a failed mint (key rotation, suspended App
        # installation, auth API outage) must degrade to the queue signal,
        # not fail the route job and with it the whole run.
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.chores_client_id }}
          private-key: ${{ secrets.chores_private_key }}

      - name: Route onto a live runner pool
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          CENSUS_TOKEN: ${{ steps.chores.outputs.token }}
          HAS_CENSUS_TOKEN: ${{ steps.chores.outputs.token != '' }}
          MINT_FAILED: ${{ steps.chores.outcome == 'failure' }}
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork || false }}
          FALLBACK_MINUTES: ${{ vars.CI_RUNNER_FALLBACK_MINUTES || 10 }}
        run: |
          set -euo pipefail
          node scripts/runner-route.ts
