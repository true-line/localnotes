# Tag-driven GitHub Release publication in the true-line/cartograph shape.
# The only supported tag producer is the Version cut workflow tagging a merged
# "Version packages" PR; this workflow validates that provenance and the exact
# tag before building and publishing the extension zip. workflow_dispatch with
# an existing tag is publication recovery only.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated vX.Y.Z tag to recover or republish
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

# Jobs run on the organisation's own runners: the Linux runner group holds one
# x86-64 runner. A fork's pull request keeps a hosted runner, because a pull
# request controls the workflow file it runs and would otherwise execute its
# own code on the organisation's hardware.
jobs:
  policy:
    name: Action Policy
    runs-on: ${{ fromJSON((github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork) && '["ubuntu-latest"]' || '["self-hosted", "Linux", "X64"]') }}
    timeout-minutes: 10
    # The organisation's Linux runner does not carry Node on its default PATH.
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # A release job never restores a cache another run could have written.
          package-manager-cache: false
      - name: Authorize direct workflow event
        uses: true-line/trueline-agent-ci/.github/actions/ci-policy@64ec289604e2409eb92fd718495df8a10761a20a
        with:
          authorization-only: 'true'

  validate:
    name: Validate reviewed release tag
    needs: policy
    runs-on: ${{ fromJSON((github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork) && '["ubuntu-latest"]' || '["self-hosted", "Linux", "X64"]') }}
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Highest-consequence context for a poisoned dependency cache; the
          # check itself needs no packages, so caching buys nothing.
          package-manager-cache: false

      - name: Validate tag, version, and reviewed cut
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          npm run version:check
          expected=$(node scripts/release-version.mjs tag)
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Requested tag $TAG does not match synchronized version tag $expected."
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/$TAG")" != 'tag' ]; then
            echo "::error::$TAG must be an annotated tag."
            exit 1
          fi

          tag_commit=$(git rev-list -n 1 "$TAG")
          if [ "$(git rev-parse HEAD)" != "$tag_commit" ]; then
            echo "::error::Checkout is not the commit referenced by $TAG."
            exit 1
          fi
          pending=$(node scripts/release-version.mjs pending)
          if [ -n "$pending" ]; then
            echo "::error::$TAG still contains pending Changesets: $pending"
            exit 1
          fi

          version_pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag_commit/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main" and .head.ref == "changeset-release/main")] | first | .number // empty')
          if [ -z "$version_pr" ]; then
            echo "::error::$TAG is not a merged changeset-release/main Version packages PR."
            exit 1
          fi

          # The checkout keeps no credentials, so a git fetch of this private
          # repo could only wait on authentication. Ask the API instead: main
          # must equal or contain the tag commit.
          ancestry=$(gh api "repos/$GITHUB_REPOSITORY/compare/$tag_commit...main" --jq .status)
          if [ "$ancestry" != ahead ] && [ "$ancestry" != identical ]; then
            echo "::error::$TAG does not resolve to a commit on main ($ancestry)."
            exit 1
          fi

          # The exact cut commit must carry its own successful post-merge CI.
          push_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=push&head_sha=$tag_commit&per_page=100" \
            --jq 'first(.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .conclusion == "success") | .id) // empty')
          if [ -z "$push_run" ]; then
            echo "::error::$tag_commit lacks a successful post-merge CI run."
            exit 1
          fi
          stable=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$push_run/jobs?filter=latest&per_page=100" \
            --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')
          if [ "$stable" != true ]; then
            echo "::error::$tag_commit lacks a successful stable CI gate."
            exit 1
          fi

          # The Version packages PR is the human review point of the cut.
          approved=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$version_pr/reviews?per_page=100" \
            --jq 'any(.[]; .state == "APPROVED")')
          if [ "$approved" != true ]; then
            echo "::error::Version packages PR #$version_pr lacks an approval."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Validated $TAG at reviewed Version packages PR #$version_pr."

  publish:
    name: Build and publish GitHub Release
    needs: validate
    runs-on: ${{ fromJSON((github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork) && '["ubuntu-latest"]' || '["self-hosted", "Linux", "X64"]') }}
    # 30 min: the bounded npm ci envelope (2 attempts x 600s + retry delay and
    # grace = 1225s) needs 60s headroom on top — same budget as the governed
    # CI test job, enforced by the runtime policy checker.
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # This is the highest-consequence context for a poisoned dependency
          # cache; the test suite must run against a cold, registry-resolved
          # install.
          package-manager-cache: false

      - name: Install locked dependencies
        uses: true-line/trueline-agent-ci/.github/actions/bounded-command@64ec289604e2409eb92fd718495df8a10761a20a
        with:
          task: Install locked dependencies
          executable: npm
          arguments-json: '["ci"]'
          timeout-seconds: '600'
          attempts: '2'
          retry-delay-seconds: '5'

      - run: npm test

      - run: npm run build

      - name: Package extension
        # adm-zip via node: the self-hosted runner does not carry a zip binary
        run: node scripts/package-extension.mjs && ls -lh "localnotes-v${VERSION}.zip"

      - name: Prepare release notes
        run: |
          node scripts/release-notes.mjs "$VERSION" > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - name: Require chores-dumb credentials
        run: test "${{ secrets.CHORES_DUMB_CLIENT_ID != '' && secrets.CHORES_DUMB_PRIVATE_KEY != '' }}" = true

      - name: Mint the chores-dumb token
        id: chores
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CHORES_DUMB_CLIENT_ID }}
          private-key: ${{ secrets.CHORES_DUMB_PRIVATE_KEY }}
          permission-contents: write

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ steps.chores.outputs.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --verify-tag \
              --draft=false \
              --title "LocalNotes $TAG" \
              --notes-file release-notes.md
            gh release upload "$TAG" "localnotes-v${VERSION}.zip" --clobber
          else
            gh release create "$TAG" "localnotes-v${VERSION}.zip" \
              --verify-tag \
              --latest \
              --title "LocalNotes $TAG" \
              --notes-file release-notes.md
          fi
